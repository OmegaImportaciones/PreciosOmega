<!DOCTYPE html>
<html lang="es">

<head>

    <!-- META -->
    <meta charset="UTF-8" />

    <!-- THEME INIT (evita parpadeo de tema equivocado al cargar) -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('omega-theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    var m = document.querySelector('meta[name="theme-color"]');
                    if (m) m.setAttribute('content', '#000000');
                }
            } catch (e) { }
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>
        Ubicación | OMEGA IMPORTACIONES
    </title>

    <meta name="description" content="Encuentra nuestra tienda física y cómo llegar fácilmente." />

    <meta name="theme-color" content="#ffffff" />

    <!-- GOOGLE ANALYTICS -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PNVK91HBNP"></script>

    <script>

        window.dataLayer =
            window.dataLayer || [];

        function gtag() {

            dataLayer.push(arguments);

        }

        gtag(
            'js',
            new Date()
        );

        gtag(
            'config',
            'G-PNVK91HBNP'
        );

    </script>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/global.css?v=3" />

</head>

<body>

    <!-- THEME TOGGLE -->
    <button id="themeToggleButton" class="theme-toggle" type="button" aria-pressed="false"
        aria-label="Cambiar a modo oscuro">

        <span class="theme-toggle-icon">
            🌙
        </span>

    </button>

    <main class="container">

        <!-- BACK BUTTON -->
        <a href="../index.html" class="main-button">

            ← Volver

        </a>

        <!-- LOGO -->
        <div class="logo-frame">
            <img src="../img/logo.png" alt="Omega Importaciones" class="logo" draggable="false">
        </div>

        <!-- SUBTEXT -->
        <p class="location-subtext">

            Visítanos en nuestra tienda física

        </p>

        <!-- INFO CARDS -->
        <section class="buttons-container">

            <!-- DIRECCION -->
            <div class="main-button info-card">

                <span class="emoji-icon">
                    📍
                </span>

                <div class="info-content">

                    <h3>
                        Dirección
                    </h3>

                    <p>
                        Av. Buenos Aires, La Paz - Bolivia
                    </p>

                </div>

            </div>

            <!-- HORARIOS -->
            <div class="main-button info-card">

                <span class="emoji-icon">
                    🕒
                </span>

                <div class="info-content">

                    <h3>
                        Horario
                    </h3>

                    <p>
                        Lunes a Sábado<br>
                        10:00 AM - 8:00 PM
                    </p>

                </div>

            </div>

            <!-- GOOGLE MAPS -->
            <a href="https://maps.app.goo.gl/xFjwGQCcVAUb3Mdr5" target="_blank" rel="noopener noreferrer"
                class="main-button">

                <span class="emoji-icon">
                    🗺️
                </span>

                <span>
                    Abrir en Google Maps
                </span>

            </a>

            <!-- TIKTOK GUIDE -->
            <a href="https://vt.tiktok.com/ZS9sLWaJa/" target="_blank" rel="noopener noreferrer" class="main-button">

                <img src="../img/t_logo.png" alt="TikTok" class="button-icon" draggable="false">

                <span>
                    Ver guía en TikTok
                </span>

            </a>

            <!-- WHATSAPP -->
            <a href="https://wa.me/59164216262?text=Hola,%20quiero%20información%20sobre%20la%20ubicación%20de%20la%20tienda"
                target="_blank" rel="noopener noreferrer" class="main-button">

                <img src="../img/w_logo.png" alt="WhatsApp" class="button-icon" draggable="false">

                <span>
                    Contactar por WhatsApp
                </span>

            </a>

        </section>

    </main>

    <!-- BACKGROUND SCRIPT -->
    <script src="../js/background.js"></script>

    <script src="../js/themeToggle.js"></script>

</body>

</html>
